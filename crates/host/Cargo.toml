[package]
name = "lucent-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
testing = ["dep:swf", "dep:wgpu"]

[dependencies]
v8 = "152.2"
lucent-protocol.workspace = true
ruffle_core.workspace = true
ruffle_frontend_utils.workspace = true
ruffle_render.workspace = true
ruffle_render_wgpu.workspace = true

swf = { workspace = true, optional = true }
wgpu = { version = "30", features = ["noop"], optional = true }

arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
async-channel = "2.5"
async-task = "4.7"
encoding_rs = "0.8.35"
hyper = { version = "1", default-features = false, features = ["http1"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "native-tls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing = "0.1"
url = "2.5"
parking_lot = "0.12"
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
dirs = "6"
cap-std = "4"
cap-fs-ext = "4"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
lucent-host = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
wgpu = { version = "30", features = ["noop"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
