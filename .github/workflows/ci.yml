name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-rust-ci') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: MEASURE start disk sampler
        run: |
          cat > "$RUNNER_TEMP/m.sh" <<'EOF'
          echo "MEASURE $1 at $(date +%s)"
          df -h . 2>&1
          if [ -d target ]; then du -sh target 2>/dev/null; du -sh target/debug/* 2>/dev/null | sort -h | tail -6; ls target/debug/deps | wc -l; fi
          exit 0
          EOF
          nohup bash -c 'while :; do echo "$(date +%s) $(df -Pk . | awk "NR==2{print \$4}")" >> "$RUNNER_TEMP/disk.log"; sleep 5; done' >/dev/null 2>&1 &
          bash "$RUNNER_TEMP/m.sh" start
          if [ "$RUNNER_OS" = Linux ]; then sudo du -sh /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/* /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm /opt/microsoft /opt/google /opt/az 2>/dev/null || true; df -h; lsblk || true; fi

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config \
            libssl-dev libzstd-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libvulkan-dev mesa-vulkan-drivers \
            libasound2-dev \
            libfontconfig-dev libfreetype-dev

      - name: Install Rust toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustup default "$channel"
          rustup toolchain uninstall stable

      - run: cargo fmt --check

      - name: Build dependencies unoptimized
        run: mkdir -p .cargo && printf '[profile.dev.package."*"]\nopt-level = 0\n' >> .cargo/config.toml

      - uses: Swatinem/rust-cache@v2

      - run: bash "$RUNNER_TEMP/m.sh" after-cache-restore
      - run: cargo run -p lucent-protocol --bin export-types -- --check
      - run: bash "$RUNNER_TEMP/m.sh" after-export-types
      - run: cargo build --workspace
      - run: bash "$RUNNER_TEMP/m.sh" after-build
      - run: cargo test --workspace
      - run: bash "$RUNNER_TEMP/m.sh" after-test
      - run: cargo test -p lucent-host --features testing
      - run: bash "$RUNNER_TEMP/m.sh" after-test-testing
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clippy -p lucent-host --features testing --tests -- -D warnings
      - run: bash "$RUNNER_TEMP/m.sh" after-clippy

      - name: MEASURE sampler summary
        if: always()
        run: |
          sort -k2 -n "$RUNNER_TEMP/disk.log" | head -3
          awk 'NR%6==1' "$RUNNER_TEMP/disk.log"

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - run: pnpm install
      - run: pnpm check:runtime-bundle
      - run: pnpm check:scripting-api
      - run: pnpm typecheck
      - run: pnpm test
