name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-rust-ci') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config \
            libssl-dev libzstd-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libvulkan-dev mesa-vulkan-drivers \
            libasound2-dev \
            libfontconfig-dev libfreetype-dev

      - name: Install Rust toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustup default "$channel"
          rustup toolchain uninstall stable

      - run: cargo fmt --check

      - name: Build dependencies unoptimized
        run: mkdir -p .cargo && printf '[profile.dev.package."*"]\nopt-level = 0\n' >> .cargo/config.toml

      - uses: Swatinem/rust-cache@v2

      - name: Find the V8 version
        id: v8
        run: echo "version=$(awk '/^name = "v8"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_OUTPUT"

      # rust-cache keeps only build, .fingerprint and deps under target/debug.
      # v8 links its static library from target/debug/gn_out whenever it recompiles.
      - name: Restore the V8 static library
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: target/debug/gn_out
          key: rusty-v8-${{ runner.os }}-${{ runner.arch }}-${{ steps.v8.outputs.version }}

      - name: Rerun the v8 build script to download its static library
        if: steps.v8-cache.outputs.cache-hit != 'true'
        run: cargo clean -p v8

      - run: cargo run -p lucent-protocol --bin export-types -- --check
      - run: cargo build --workspace

      - name: Save the V8 static library
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/debug/gn_out
          key: ${{ steps.v8-cache.outputs.cache-primary-key }}

      - run: cargo test --workspace
      - run: cargo test -p lucent-host --features testing
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clippy -p lucent-host --features testing --tests -- -D warnings

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - run: pnpm install
      - run: pnpm check:runtime-bundle
      - run: pnpm check:scripting-api
      - run: pnpm typecheck
      - run: pnpm test
